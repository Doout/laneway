openapi: 3.1.0
info:
  title: Laneway Management API
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  summary: Versioned administrator management and browser-session contract.
  description: >-
    The current v1 administrator surface. It intentionally documents bounded
    list snapshots and cursor-paginated audit streams alongside current
    mutation semantics without claiming totals, entity tags, preconditions, or
    idempotency keys that are not yet implemented. JSON request objects are
    strict and reject unknown fields.
tags:
  - name: Authentication
    description: Browser administrator authentication and root automation probes.
  - name: Administrators
    description: Administrator principals, credentials, grants, and sessions.
  - name: Automation
    description: Scoped service principals and revocable access tokens.
  - name: Applications
    description: Registered applications, network installations, OAuth consent, and node installers.
  - name: Networks
    description: Network inventory and creation.
  - name: Enrollment
    description: One-time enrollment credentials and bootstrap bundles.
  - name: Nodes
    description: Node inventory and administrative state.
  - name: Routes
    description: Managed route inventory and state transitions.
  - name: ACL
    description: Network ACL rules using strict TrafficSelector protobuf JSON.
  - name: Access
    description: Network-scoped Users, Teams, and explicit Network, Node, or Exit grants.
  - name: Relays
    description: Relay inventory and state.
  - name: Certificates
    description: Certificate inventory and revocation.
  - name: Audit
    description: Global and network-scoped audit snapshots and cursor pages.

paths:
  /v1/admin/auth/state:
    get:
      operationId: getAdministratorAuthState
      tags: [Authentication]
      summary: Read the authentication entry state.
      description: Unauthenticated and direct-peer rate limited. Supplied credentials are ignored.
      security: []
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AuthState'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/login:
    post:
      operationId: loginAdministrator
      tags: [Authentication]
      summary: Create an administrator browser session.
      description: >-
        Requires an HTTPS same-origin Origin, rejects every supplied bearer, and
        rejects an active administrator session. A stale or expired session
        cookie may be replaced. No CSRF header is required before a session exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AdministratorLoginRequest'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AdministratorSessionView'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/session:
    get:
      operationId: getAdministratorSession
      tags: [Authentication]
      summary: Read and touch the current browser session.
      description: Requires both the session and CSRF cookies. It does not require an Origin or CSRF header.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AdministratorSessionView'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/session/rotate:
    post:
      operationId: rotateAdministratorSession
      tags: [Authentication]
      summary: Rotate the browser session family.
      description: Atomically replaces the current session and CSRF secrets.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AdministratorSessionView'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/logout:
    post:
      operationId: logoutAdministrator
      tags: [Authentication]
      summary: Revoke the browser session family.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
      responses:
        '204':
          $ref: './components.yaml#/components/responses/SessionNoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/root:
    get:
      operationId: probeRootAdministratorCredential
      tags: [Authentication]
      summary: Validate the root automation credential.
      description: >-
        Automation-only. Any Origin or Sec-Fetch-* header causes authentication
        failure, so this operation is unavailable to browser contexts.
      security:
        - rootBearer: []
      responses:
        '204':
          $ref: './components.yaml#/components/responses/NoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/bootstrap:
    post:
      operationId: bootstrapAdministrator
      tags: [Authentication]
      summary: Consume a grant to create the initial owner.
      description: Requires an HTTPS same-origin Origin and rejects all supplied administrator credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AdministratorBootstrapRequest'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/NoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/recover:
    post:
      operationId: recoverAdministrator
      tags: [Authentication]
      summary: Consume a grant to recover its owner.
      description: Requires an HTTPS same-origin Origin and rejects all supplied administrator credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AdministratorRecoveryRequest'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/NoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/bootstrap-grants:
    post:
      operationId: issueAdministratorBootstrapGrant
      tags: [Authentication]
      summary: Issue a one-time initial-owner bootstrap grant.
      description: Root automation only. Reissue supersedes an unconsumed grant.
      security:
        - rootBearer: []
      responses:
        '201':
          $ref: './components.yaml#/components/responses/RecoveryGrant'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/root-token-rotations/{rotation_id}/begin:
    post:
      operationId: beginRootAdministratorTokenRotation
      tags: [Authentication]
      summary: Journal the beginning of a root-token rotation.
      description: Root automation only. Repeating the same begin operation is idempotent.
      security:
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/RotationID'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/NoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/auth/root-token-rotations/{rotation_id}/complete:
    post:
      operationId: completeRootAdministratorTokenRotation
      tags: [Authentication]
      summary: Journal completion of a root-token rotation.
      description: Root automation only. Repeating completion is idempotent; completion before begin conflicts.
      security:
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/RotationID'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/NoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'

  /v1/admin/administrators:
    post:
      operationId: createAdministrator
      tags: [Administrators]
      summary: Create an administrator principal.
      description: Owner session or root automation. Session requests require same-origin CSRF protection.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateAdministratorRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/AdministratorCreated'
        default:
          $ref: './components.yaml#/components/responses/Error'
    get:
      operationId: listAdministrators
      tags: [Administrators]
      summary: Read a bounded administrator snapshot.
      description: >-
        Owner session or root automation. An exact username filter is accepted
        only with root automation and cannot be combined with limit.
      security:
        - administratorSession: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/Limit'
        - name: username
          in: query
          required: false
          description: Root-only exact canonical username filter.
          schema:
            $ref: './components.yaml#/components/schemas/Username'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Administrators'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/administrators/{principal_id}:
    get:
      operationId: getAdministrator
      tags: [Administrators]
      summary: Read an administrator principal.
      security:
        - administratorSession: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Administrator'
        default:
          $ref: './components.yaml#/components/responses/Error'
    patch:
      operationId: updateAdministrator
      tags: [Administrators]
      summary: Replace administrator access and/or enabled state.
      description: Owner session or root automation. Access changes revoke the target's active sessions.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AdministratorUpdateRequest'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Administrator'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/administrators/{principal_id}/password:
    post:
      operationId: replaceAdministratorPassword
      tags: [Administrators]
      summary: Replace an administrator password.
      description: Owner session or root automation. Replacing the caller's password revokes that session.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/PasswordReplacementRequest'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/SessionNoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/administrators/{principal_id}/recovery-grants:
    post:
      operationId: issueAdministratorRecoveryGrant
      tags: [Administrators]
      summary: Issue a recovery grant for an owner.
      description: Root automation only.
      security:
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/RecoveryGrant'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/administrators/{principal_id}/sessions:
    get:
      operationId: listAdministratorSessions
      tags: [Administrators]
      summary: Read a bounded session snapshot for an administrator.
      security:
        - administratorSession: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AdministratorSessions'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/sessions/{session_id}/revoke:
    post:
      operationId: revokeAdministratorSession
      tags: [Administrators]
      summary: Revoke an administrator session.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/SessionRevocationRequest'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/SessionNoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/service-principals:
    post:
      operationId: createServicePrincipal
      tags: [Automation]
      summary: Create a scoped automation principal.
      description: >-
        Owner session or root automation. Permissions and network visibility are
        explicit; no human owner role is inherited.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateServicePrincipalRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/ServicePrincipalCreated'
        default:
          $ref: './components.yaml#/components/responses/Error'
    get:
      operationId: listServicePrincipals
      tags: [Automation]
      summary: Read a bounded service-principal snapshot.
      description: >-
        Enabled principals sort first and are capped at 100, so the default
        100-record inventory always includes every enabled automation identity.
        A larger limit may include disabled history.
      security:
        - administratorSession: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/ServicePrincipals'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/service-principals/{principal_id}/disable:
    post:
      operationId: disableServicePrincipal
      tags: [Automation]
      summary: Disable an automation principal and revoke its tokens.
      description: >-
        Owner session or root automation. Disabling is irreversible in v1 and
        atomically revokes every unrevoked token belonging to the principal.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/SessionNoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/service-principals/{principal_id}/tokens:
    post:
      operationId: issueServiceAccessToken
      tags: [Automation]
      summary: Issue a service access token.
      description: The bearer is returned once and only its digest is persisted.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/IssueServiceAccessTokenRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/ServiceAccessTokenIssued'
        default:
          $ref: './components.yaml#/components/responses/Error'
    get:
      operationId: listServiceAccessTokens
      tags: [Automation]
      summary: Read safe token metadata for one service principal.
      description: >-
        Live tokens sort first. At most 100 unrevoked tokens may belong to one
        principal, so the default 100-record inventory always includes every
        bearer that can still authorize a request. A larger limit may include
        revoked history.
      security:
        - administratorSession: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/PrincipalID'
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/ServiceAccessTokens'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/service-access-tokens/{token_id}/revoke:
    post:
      operationId: revokeServiceAccessToken
      tags: [Automation]
      summary: Revoke a service access token immediately.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
      parameters:
        - $ref: './components.yaml#/components/parameters/TokenID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ServiceAccessTokenRevocationRequest'
      responses:
        '204':
          $ref: './components.yaml#/components/responses/SessionNoContent'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/audit:
    get:
      operationId: listGlobalAuditEvents
      tags: [Audit]
      summary: Read a bounded global audit snapshot.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AuditEvents'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/audit/page:
    get:
      operationId: pageGlobalAuditEvents
      tags: [Audit]
      summary: Read one cursor page of the global audit stream.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/Limit'
        - $ref: './components.yaml#/components/parameters/AuditCursor'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/AuditEventPage'
        default:
          $ref: './components.yaml#/components/responses/Error'

  /v1/admin/enrollment-tokens:
    post:
      operationId: issueEnrollmentToken
      tags: [Enrollment]
      summary: Issue a one-time node enrollment token.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
        - serviceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/EnrollmentTokenRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/EnrollmentToken'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/bootstrap-bundles:
    post:
      operationId: createBootstrapBundle
      tags: [Enrollment]
      summary: Store an ephemeral, one-use bootstrap script.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
        - serviceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/BootstrapBundleRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/BootstrapBundle'
        default:
          $ref: './components.yaml#/components/responses/Error'

  /v1/admin/networks:
    post:
      operationId: createNetwork
      tags: [Networks]
      summary: Create a network.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
        - serviceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/NetworkRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/Network'
        default:
          $ref: './components.yaml#/components/responses/Error'
    get:
      operationId: listNetworks
      tags: [Networks]
      summary: Read a bounded, authorization-filtered network snapshot.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Networks'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/networks/{network_id}:
    get:
      operationId: getNetwork
      tags: [Networks]
      summary: Read a network.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NetworkID'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Network'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/networks/{network_id}/nodes:
    get:
      operationId: listNetworkNodes
      tags: [Nodes]
      summary: Read a bounded network node snapshot.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NetworkID'
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Nodes'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/networks/{network_id}/node-locations:
    get:
      operationId: listNetworkNodeLocations
      tags: [Nodes]
      summary: Read approximate node locations without exposing source IPs.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NetworkID'
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Latest approximate locations; manual overrides take precedence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [node_locations, automatic_enabled]
                properties:
                  automatic_enabled: { type: boolean }
                  location_provider: { type: string, enum: ['', db-ip, maxmind] }
                  node_locations:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/NodeLocation'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/nodes/{node_id}/location:
    put:
      operationId: setNodeLocation
      tags: [Nodes]
      summary: Set an audited manual node location override.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NodeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/NodeLocationOverride'
      responses:
        '204':
          description: Manual location saved.
        default:
          $ref: './components.yaml#/components/responses/Error'
    delete:
      operationId: clearNodeLocation
      tags: [Nodes]
      summary: Clear a manual override and return to automatic location.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NodeID'
      responses:
        '204':
          description: Manual override cleared.
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/networks/{network_id}/endpoint-statuses:
    get:
      operationId: listNetworkEndpointStatuses
      tags: [Nodes]
      summary: Read bounded latest endpoint status with explicit TTL freshness.
      description: >-
        Returns one row per bounded Node inventory entry. Runtime report fields
        are present only while their controller-owned TTL is current; expired,
        never-reported, and inactive Nodes do not retain stale health fields.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NetworkID'
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/EndpointStatuses'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/networks/{network_id}/relays:
    get:
      operationId: listNetworkRelays
      tags: [Relays]
      summary: Read a bounded network relay snapshot.
      security:
        - administratorSession: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NetworkID'
        - $ref: './components.yaml#/components/parameters/Limit'
      responses:
        '200':
          $ref: './components.yaml#/components/responses/Relays'
        default:
          $ref: './components.yaml#/components/responses/Error'
    post:
      operationId: registerNetworkRelay
      tags: [Relays]
      summary: Register a relay in a network.
      security:
        - administratorSession: []
          administratorCsrfCookie: []
          administratorCsrfHeader: []
        - rootBearer: []
        - serviceAccessToken: []
      parameters:
        - $ref: './components.yaml#/components/parameters/NetworkID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/RegisterRelayRequest'
      responses:
        '201':
          $ref: './components.yaml#/components/responses/Relay'
        default:
          $ref: './components.yaml#/components/responses/Error'
  /v1/admin/networks/{network_id}/acl-rules:
    get:
      operationId: listNetworkACLRules
      tags: [ACL]
