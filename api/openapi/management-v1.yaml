  /applications/new:
    post:
      operationId: startApplicationRegistration
      tags: [Applications]
      summary: Start browser registration for an application.
      description: Rate-limited untrusted input. Production callback URIs require HTTPS; PKCE S256 is mandatory.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, state, code_challenge, code_challenge_method]
              properties:
                manifest:
                  type: string
                  description: JSON-encoded ApplicationManifest.
                state:
                  type: string
                  minLength: 1
                  maxLength: 1024
                code_challenge:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
                code_challenge_method:
                  type: string
                  const: S256
      responses:
        '303':
          description: Continue on the same-origin registration consent page.
          headers:
            Location:
              required: true
              schema:
                type: string
                pattern: '^/applications/consent\?request=(?!0{32}$)[0-9a-f]{32}$'
        default:
          description: OAuth-style JSON error with no-store caching.
  /v1/application-registrations/exchange:
    post:
      operationId: exchangeApplicationRegistration
      tags: [Applications]
      summary: Exchange a one-time registration code for application credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, code_verifier]
              properties:
                code:
                  type: string
                  format: password
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
      responses:
        '200':
          description: One-time application credential disclosure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [application_id, client_id, client_secret, name]
                properties:
                  application_id:
                    $ref: './components.yaml#/components/schemas/Identifier'
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    format: password
                  name:
                    type: string
        default:
          description: OAuth-style JSON error with no-store caching.
  /oauth/authorize:
    get:
      operationId: startApplicationAuthorization
      tags: [Applications]
      summary: Start an application authorization-code flow.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        '303':
          description: Continue on the same-origin network consent page.
          headers:
            Location:
              required: true
              schema:
                type: string
                pattern: '^/applications/install\?request=(?!0{32}$)[0-9a-f]{32}$'
        default:
          description: OAuth-style JSON error with no-store caching.
  /oauth/authorization-requests/{request_id}:
    get:
      operationId: getApplicationAuthorizationRequest
      tags: [Applications]
      summary: Read the safe display data for a pending authorization request.
      security: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            $ref: './components.yaml#/components/schemas/Identifier'
      responses:
        '200':
          description: Pending authorization request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, application, redirect_uri, scopes, expires_at_unix_seconds]
                properties:
                  request_id:
                    $ref: './components.yaml#/components/schemas/Identifier'
                  application:
                    $ref: './components.yaml#/components/schemas/RegisteredApplication'
                  redirect_uri:
                    type: string
                    format: uri
                  scopes:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/ApplicationScope'
                  expires_at_unix_seconds:
                    $ref: './components.yaml#/components/schemas/UnixSeconds'
        default:
          description: OAuth-style JSON error with no-store caching.
  /oauth/token:
