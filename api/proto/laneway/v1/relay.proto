syntax = "proto3";

package laneway.v1;

option go_package = "github.com/Doout/laneway/go/api/laneway/v1;lanewayv1";

import "laneway/v1/control.proto";

message RelayRegister {
  bytes session_id = 1;
  uint32 requested_max_routes = 2;
}

message RouteHandleBinding {
  // Handle zero is reserved and must not be allocated.
  fixed32 route_handle = 1;
  bytes peer_node_id = 2;
  uint32 max_packet_payload = 3;
}

message RouteHandleRelease {
  fixed32 route_handle = 1;
}

enum EndpointTransport {
  ENDPOINT_TRANSPORT_UNSPECIFIED = 0;
  ENDPOINT_TRANSPORT_QUIC_UDP = 1;
  ENDPOINT_TRANSPORT_TLS_TCP = 2;
}

message EndpointCandidate {
  bytes node_id = 1;
  bytes ip_address = 2;
  uint32 port = 3;
  EndpointTransport transport = 4;
  uint32 priority = 5;
  // Set by the authenticated relay when it forwards an observed endpoint.
  // Publishers MUST leave these fields empty; receivers require 16 bytes.
  bytes rendezvous_token = 6;
  // Coordinated probe start in Unix nanoseconds. Generated by the relay.
  fixed64 probe_start_unix_nano = 7;
}

message RelayEnvelope {
  uint32 schema_version = 1;
  uint64 sequence = 2;
  oneof body {
    RelayRegister register = 10;
    RouteHandleBinding route_handle_binding = 11;
    RouteHandleRelease route_handle_release = 12;
    EndpointCandidate endpoint_candidate = 13;
    ProtocolError error = 14;
  }
}
