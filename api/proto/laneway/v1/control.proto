syntax = "proto3";

package laneway.v1;

option go_package = "github.com/Doout/laneway/go/api/laneway/v1;lanewayv1";

// Opaque identifiers are exactly 16 bytes. Receivers MUST reject other sizes.
message NetworkRef {
  bytes network_id = 1;
}

message NodeRef {
  bytes network_id = 1;
  bytes node_id = 2;
}

// Capability values are bit masks carried in uint64 capability fields.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_LANEWAY_RELAY_V1 = 1;
  CAPABILITY_LANEWAY_QUIC_DATAGRAM_V1 = 2;
  CAPABILITY_LANEWAY_DIRECT_PEER_V1 = 4;
  CAPABILITY_LANEWAY_SUBNET_ROUTER_V1 = 8;
  CAPABILITY_LANEWAY_EXIT_NODE_V1 = 16;
  CAPABILITY_LANEWAY_TCP_FALLBACK_V1 = 32;
  CAPABILITY_LANEWAY_IPV6_V1 = 64;
  CAPABILITY_LANEWAY_E2E_PACKET_V1 = 128;
}

message Hello {
  bytes network_id = 1;
  bytes node_id = 2;
  bytes boot_id = 3;
  uint32 protocol_major = 4;
  uint32 protocol_minor = 5;
  uint64 capabilities = 6;
}

message Welcome {
  bytes session_id = 1;
  uint64 configuration_epoch = 2;
  // Network-order IPv4 (4 bytes) or IPv6 (16 bytes), never text.
  repeated bytes overlay_addresses = 3;
  uint64 capabilities = 4;
  uint32 max_control_payload = 5;
  uint32 max_packet_payload = 6;
}

message Ping {
  uint64 nonce = 1;
  uint64 sent_unix_millis = 2;
}

message Pong {
  uint64 nonce = 1;
  uint64 received_unix_millis = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_MALFORMED = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_STALE_EPOCH = 5;
  ERROR_CODE_RESOURCE_EXHAUSTED = 6;
  ERROR_CODE_INTERNAL = 7;
}

message ProtocolError {
  ErrorCode code = 1;
  string detail = 2;
  bool retryable = 3;
}

message ConfigurationAck {
  uint64 configuration_epoch = 1;
}

message Disconnect {
  ErrorCode reason = 1;
  string detail = 2;
}

// ControlEnvelope is the payload of a 4-byte, big-endian length-prefixed frame.
// schema_version is 1 for this package. Exactly one body member must be set.
message ControlEnvelope {
  uint32 schema_version = 1;
  uint64 sequence = 2;
  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Ping ping = 12;
    Pong pong = 13;
    ProtocolError error = 14;
    ConfigurationAck configuration_ack = 15;
    Disconnect disconnect = 16;
  }
}
