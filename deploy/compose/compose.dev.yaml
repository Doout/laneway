# Local builds use the same images and commands as the release deployment.
services:
  controller:
    image: laneway-console:dev
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile.rust-relay
      target: controller
  relay:
    image: laneway-relay:dev
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile.rust-relay
      target: relay
  admin:
    image: laneway-edge:dev
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile.exit-node
      target: edge
  exit-node:
    image: laneway-edge:dev
    pull_policy: never
