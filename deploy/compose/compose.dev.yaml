# Historical development fixture for the Go controller and packet tests.
# Fresh deployments use the Rust Compose overlay and installer.
services:
  controller:
    image: laneway-controller:dev
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile
      target: controller
  relay:
    image: laneway-relay:dev
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile
      target: relay
  admin:
    image: laneway-admin:dev
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile
      target: admin
  exit-node:
    image: laneway-exit-node:dev
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile.exit-node
      target: go-exit
