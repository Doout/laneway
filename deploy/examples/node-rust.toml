mode = "node"
socket_path = "/run/laneway/lanewayd.sock"
exit_intent_path = "/var/lib/laneway/exit-intent-v1.json"

[identity]
network_id = "000102030405060708090a0b0c0d0e0f"
node_id = "101112131415161718191a1b1c1d1e1f"

[tls]
certificate = "/etc/laneway/node.crt"
private_key = "/etc/laneway/node.key"
ca = "/etc/laneway/ca.crt"

[tun]
name = "lane0"
mtu = 1280
addresses = ["100.96.0.1/32"]
configure = true

[relay]
address = "203.0.113.10:4433"
server_name = "relay.example.com"
service_id = "303132333435363738393a3b3c3d3e3f"
queue_depth = 256
max_routes = 4096
handshake_timeout = "10s"
idle_timeout = "45s"
keepalive = "15s"
reconnect_min = "250ms"
reconnect_max = "15s"
quic_recovery_interval = "5s"

[tcp_fallback]
address = "203.0.113.10:443"
handshake_timeout = "10s"
write_timeout = "10s"
idle_timeout = "45s"
keepalive_period = "15s"
queue_depth = 128

[direct]
# Relay QUIC, rendezvous probes, and direct QUIC reuse this UDP socket.
listen = "0.0.0.0:0"
probe_interval = "200ms"
probe_timeout = "3s"
probe_attempts = 3
candidate_refresh_interval = "30s"

[forwarding]
subnet_router = false
exit_gateway = false
owned_prefixes = []
# systemd-resolved command and crash-safe DNS ownership journal defaults:
# resolvectl_command = "resolvectl"
# dns_state_file = "/run/laneway/lanewayd-rs-dns-state.json"
# When enabling subnet_router, add one or more exact entries:
# [[forwarding.subnet_routes]]
# prefix = "192.168.50.0/24"
# mode = "nat" # or "routed"
# output_interface = "lan0"
#
# When enabling exit_gateway, configure exact client sources and output:
# exit_gateway_sources = ["100.96.0.0/24", "fd00:96::/64"]
# exit_output_interface = "eth0"
#
# Exit-client defaults additionally require an explicit local selection:
# [forwarding.exit_client]
# enabled = true
# authorized = true
# selected_node = "202122232425262728292a2b2c2d2e2f"
# failure_mode = "closed"
# local_lan_bypass = ["192.168.0.0/16"]
# dns_servers = ["1.1.1.1", "2606:4700:4700::1111"]

# Optional, loopback-only Prometheus endpoint. It serves GET /metrics only.
# [diagnostics]
# listen = "127.0.0.1:6062"

[[routes]]
prefix = "100.96.0.2/32"
via_node = "202122232425262728292a2b2c2d2e2f"
kind = "overlay"

# Direct peer allowlist. Omit address for rendezvous-only operation; retaining
# it also enables a static direct dial. Node certificates use the CA chain,
# both client/server EKUs, and an exact network/node SPIFFE URI SAN; no DNS SAN
# is required. server_name is retained only for older configuration parity.
[[direct_peers]]
node_id = "202122232425262728292a2b2c2d2e2f"
address = "198.51.100.22:4434"
server_name = "peer-2.example.com"
