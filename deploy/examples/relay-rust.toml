mode = "relay"
state_dir = "/var/lib/laneway-relay"
socket_path = "/run/laneway/relay.sock"

[tls]
certificate = "/etc/laneway/relay.crt"
private_key = "/etc/laneway/relay.key"
ca = "/etc/laneway/ca.crt"

[relay]
listen = ":4433"
queue_depth = 256
# Optional aggregate packet-data ceiling shared by QUIC and TCP fallback.
# Both values must be set together. Exhaustion drops the newest packet.
packet_rate_bits_per_second = 2000000
packet_burst_bytes = 65536
max_sessions = 4096
max_routes = 4096
handshake_timeout = "10s"
idle_timeout = "45s"
metrics_interval = "30s"
# Optional, unauthenticated Prometheus endpoint. Loopback IPs are required.
metrics_listen = "127.0.0.1:6063"
candidate_republish_floor = "5s"

[tcp_fallback]
listen = ":443"
handshake_timeout = "10s"
write_timeout = "10s"
idle_timeout = "45s"
keepalive_period = "15s"
queue_depth = 128

[[peers]]
network_id = "000102030405060708090a0b0c0d0e0f"
node_id = "101112131415161718191a1b1c1d1e1f"
prefixes = ["100.96.0.1/32"]

