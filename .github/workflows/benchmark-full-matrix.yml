name: Dataplane benchmark matrix

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataplane-benchmarks:
    name: Linux ${{ matrix.arch }} dataplane matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: rust
          shared-key: dataplane-benchmarks-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the benchmark
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p laneway-bench
      - name: Run native dataplane matrix
        run: |
          set -euo pipefail
          for mode in node relay relay-forward; do
            for flows in 1 10 100; do
              for size in 64 1200; do
                rust/target/release/laneway-bench --mode "$mode" --flows "$flows" \
                  --packet-size "$size" --duration-secs 2 --json
              done
            done
          done | tee benchmark-matrix.jsonl
          jq -es 'length == 18 and all(.[]; .packets > 0) and
            (unique_by([.mode, .flows, .packet_size]) | length == 18)' benchmark-matrix.jsonl > /dev/null
      - name: Record runner environment
        run: |
          {
            uname -a
            rustc --version --verbose
            cargo --version
            lscpu
          } > benchmark-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-matrix-${{ matrix.arch }}
          path: |
            benchmark-matrix.jsonl
            benchmark-environment.txt
          if-no-files-found: error
