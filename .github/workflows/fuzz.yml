name: Timed fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/identity
            target: FuzzParseID
          - package: ./internal/identity
            target: FuzzParseSPIFFE
          - package: ./internal/protocol
            target: FuzzControlFrame
          - package: ./internal/protocol
            target: FuzzPacketRoundTrip
          - package: ./internal/protocol
            target: FuzzDecodePacket
          - package: ./internal/routing
            target: FuzzSnapshotLookup
          - package: ./internal/agent
            target: FuzzControlCodecRead
          - package: ./internal/agent
            target: FuzzValidateHello
          - package: ./internal/agent
            target: FuzzValidateWelcome
          - package: ./internal/controllerservice
            target: FuzzStrictManagementJSON
          - package: ./internal/controllerservice
            target: FuzzTrafficSelectorProtoJSON
          - package: ./internal/directpath
            target: FuzzParseProbePacket
          - package: ./internal/relayservice
            target: FuzzRelayCodecRead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Fuzz ${{ matrix.target }} for 30 seconds
        working-directory: go
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          fuzz_log="$(mktemp)"
          trap 'rm -f "$fuzz_log"' EXIT

          run_fuzz() {
            go test "$FUZZ_PACKAGE" -run '^$' \
              -fuzz "^${FUZZ_TARGET}$" -fuzztime 30s 2>&1 | tee "$fuzz_log"
          }

          if run_fuzz; then
            exit 0
          fi

          # Go 1.26 can leak the normal fuzz deadline as a test failure.
          # Retry only that exact shutdown race; crashes and reproducers stay red.
          if grep -Fq -- "--- FAIL: ${FUZZ_TARGET} (" "$fuzz_log" \
            && grep -Eq '^[[:space:]]+context deadline exceeded$' "$fuzz_log" \
            && ! grep -Eq 'panic:|Failing input written to' "$fuzz_log"; then
            echo "::warning::Retrying ${FUZZ_TARGET} after the Go fuzz deadline race"
            : > "$fuzz_log"
            run_fuzz
          else
            exit 1
          fi

  rust-fuzz:
    name: rust/${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        target:
          - packet
          - control
          - tcp_record
          - direct_probe
          - spiffe
          - certificate_der
          - policy_routing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }} for 30 seconds
        working-directory: rust/fuzz
        run: cargo +nightly fuzz run '${{ matrix.target }}' -- -max_total_time=30 -timeout=5
