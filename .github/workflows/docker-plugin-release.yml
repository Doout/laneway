name: Release Docker network plugin

on:
  push:
    tags: ["docker-plugin/v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} plugin
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        run: echo "value=${GITHUB_REF_NAME#docker-plugin/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build rootfs
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./deploy/docker-plugin/build-rootfs.sh dist/docker-plugin
      - name: Test managed-plugin package
        run: |
          ref="ghcr.io/doout/laneway-docker-plugin:${{ steps.version.outputs.value }}-${{ matrix.arch }}"
          docker plugin create "$ref" dist/docker-plugin
          docker plugin enable "$ref"
          docker plugin disable "$ref"
          docker plugin push "$ref"
      - name: Generate SBOM and checksums
        uses: anchore/sbom-action@v0
        with:
          path: dist/docker-plugin/rootfs
          format: spdx-json
          output-file: dist/laneway-docker-plugin-${{ matrix.arch }}.spdx.json
          artifact-name: laneway-docker-plugin-${{ matrix.arch }}-sbom
          upload-artifact: false
          upload-release-assets: false
      - run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "dist/laneway-docker-plugin-${{ matrix.arch }}.tar.gz" -C dist/docker-plugin config.json rootfs
          sha256sum "dist/laneway-docker-plugin-${{ matrix.arch }}.tar.gz" "dist/laneway-docker-plugin-${{ matrix.arch }}.spdx.json" > "dist/laneway-docker-plugin-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: laneway-docker-plugin-${{ matrix.arch }}
          path: |
            dist/laneway-docker-plugin-${{ matrix.arch }}.tar.gz
            dist/laneway-docker-plugin-${{ matrix.arch }}.spdx.json
            dist/laneway-docker-plugin-${{ matrix.arch }}.sha256

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: laneway-docker-plugin-*
          path: dist
          merge-multiple: true
      - id: version
        run: echo "value=${GITHUB_REF_NAME#docker-plugin/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        run: |
          image="ghcr.io/doout/laneway-docker-plugin:${{ steps.version.outputs.value }}"
          docker manifest create "$image" \
            "$image-amd64" "$image-arm64"
          docker manifest push "$image"
      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.3
      - name: Sign published manifest
        run: cosign sign "ghcr.io/doout/laneway-docker-plugin:${{ steps.version.outputs.value }}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" dist/*
