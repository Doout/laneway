name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      privileged_linux:
        description: Run disposable privileged Linux network-namespace tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: Test
        working-directory: go
        run: go test -race ./...
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l go)"

  protobuf:
    name: Protobuf lint and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: bufbuild/buf-setup-action@v1
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: buf lint
      - run: buf generate
      - run: git diff --exit-code -- go/api

  compose:
    name: Hardened Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose security, storage, health, and port model
        run: |
          ./integration/compose-config.sh
          ./integration/release-contract.sh
          ./integration/lane-workflows.sh
          sudo ./integration/lane-prepare.sh
          sudo env PATH="$PATH" ./integration/lane-recovery.sh
      - name: Build pinned release image families
        run: |
          docker build --file deploy/containers/Dockerfile \
            --build-arg BINARY=laneway --build-arg VERSION=ci \
            --tag laneway-admin:ci .
          docker build --file deploy/containers/Dockerfile.exit-node \
            --build-arg VERSION=ci --tag laneway-exit-node:ci .
          test "$(docker run --rm --network none laneway-admin:ci version)" = ci
          test "$(docker run --rm --network none --entrypoint /usr/local/bin/laneway laneway-exit-node:ci version)" = ci

  rust:
    name: Rust workspace and Go interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Go nodes through Rust relay
        working-directory: go
        run: go test -count=1 -race -tags=rustinterop ./integration/rustrelay -v
      - name: Install Rust node interoperability network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Rust node executable interoperability
        run: >-
          sudo env PATH="$PATH" HOME="$HOME"
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          LANEWAY_RUN_PRIVILEGED=1 ./integration/rust-node-interop.sh

  cross-build:
    name: Go build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Compile all packages
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  rust-cross-build:
    name: Rust check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 C cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Check complete Rust workspace
        run: >-
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
          --target '${{ matrix.target }}' --locked

  privileged-linux:
    name: Privileged Linux network namespaces
    if: github.event_name == 'workflow_dispatch' && inputs.privileged_linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Run isolated privileged suite
        run: sudo env LANEWAY_RUN_PRIVILEGED=1 ./integration/linux-netns.sh
