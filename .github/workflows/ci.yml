name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      privileged_linux:
        description: Run disposable privileged Linux network-namespace tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Admin console
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Validate management API contract and generated client
        working-directory: web
        run: corepack pnpm api:check
      - name: Reject an unscoped console build
        working-directory: web
        run: |
          if corepack pnpm build; then
            echo "unscoped console build unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Lint, typecheck, and unit tests
        working-directory: web
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Build and test the demo artifact
        working-directory: web
        run: |
          corepack pnpm build:demo
          LANEWAY_EXPECTED_BUILD_MODE=demo corepack pnpm test:e2e
      - name: Build and smoke-test the live artifact
        working-directory: web
        run: |
          corepack pnpm build:live
          LANEWAY_EXPECTED_BUILD_MODE=live corepack pnpm exec playwright test e2e/build-mode.spec.ts e2e/node-map.spec.ts

  desktop:
    name: Desktop foundation (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install desktop dependencies
        working-directory: desktop
        run: corepack pnpm install --frozen-lockfile
      - name: Validate endpoint UI
        working-directory: desktop
        run: corepack pnpm check
      - name: Validate native local-daemon boundary
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Compile the unsigned macOS application
        working-directory: desktop
        run: corepack pnpm tauri build --no-bundle

  desktop-linux-boundary:
    name: Desktop local-daemon boundary (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set the Ubuntu package cache rotation
        id: apt-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore cached Ubuntu package downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tauri-apt/*.deb
          key: tauri-apt-ubuntu-24.04-v1-${{ runner.arch }}-${{ steps.apt-cache.outputs.week }}
          restore-keys: tauri-apt-ubuntu-24.04-v1-${{ runner.arch }}-
      - name: Install Tauri Linux build dependencies
        timeout-minutes: 24
        run: |
          archives="$RUNNER_TEMP/tauri-apt"
          mkdir -p "$archives"
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o Acquire::https::Timeout=30 \
            -o Dir::Cache::archives="$archives" install --yes --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Build the endpoint UI
        working-directory: desktop
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - name: Test Linux-only daemon commands and trust checks
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  protobuf:
    name: Protobuf schema lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'
          github_token: ${{ github.token }}
      - run: buf lint

  compose:
    name: Hardened Compose contract
    runs-on: ubuntu-24.04
    env:
      PREVIEW_VERSION: &preview-version "0.0.1"
      PREVIEW_ARCH: amd64
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose security, storage, health, and port model
        run: |
          python3 -m unittest discover -s deploy/compose -p 'test_*.py'
          ./integration/compose-config.sh
          bash -n deploy/ephemeral-exit/bootstrap.sh
          shellcheck deploy/ephemeral-exit/bootstrap.sh
          ./integration/release-contract.sh
          ./integration/client-installer.sh
          sh integration/rust-compose-release.sh
          sh integration/rust-go-runtime-guard.sh
          ./integration/connector-updater.sh
          ./integration/control-plane-prepare.sh
          sudo env PATH="$PATH" ./integration/control-plane-install.sh
          sudo env PATH="$PATH" ./integration/control-plane-upgrade.sh
          ./integration/lane-workflows.sh
          ./integration/administrator-lifecycle.sh
          sudo ./integration/lane-prepare.sh
          sudo env PATH="$PATH" ./integration/lane-recovery.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with: &preview-builder
          version: v0.36.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Restore the Linux package preview binaries
        id: preview-cache
        uses: actions/cache/restore@v4
        with: &preview-cache-inputs
          path: ${{ runner.temp }}/laneway-rust
          key: >-
            rust-linux-preview-v1-${{ env.PREVIEW_ARCH }}-${{ env.PREVIEW_VERSION }}-${{ hashFiles('rust/**', 'api/proto/**',
            'deploy/containers/Dockerfile.rust-release*', 'deploy/examples/*rust*.toml',
            'deploy/compose/generated/config/exit-node.toml.example', 'testvectors/local-api/**') }}
      - name: Build the shared Rust runtime on a cache miss
        if: steps.preview-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/containers/Dockerfile.rust-release
          target: artifacts
          platforms: linux/amd64
          build-args: VERSION=${{ env.PREVIEW_VERSION }}
          outputs: type=local,dest=${{ runner.temp }}/laneway-rust
          cache-from: type=gha,scope=rust-release-deps-amd64,timeout=1m
      - name: Build pinned release image families
        run: |
          for role in controller relay; do
            docker buildx build --load --file deploy/containers/Dockerfile.rust-relay \
              --target "$role" --build-arg VERSION="$PREVIEW_VERSION" \
              --build-context "controller-binary=$RUNNER_TEMP/laneway-rust" \
              --build-context "relay-binary=$RUNNER_TEMP/laneway-rust" \
              --build-context "healthcheck-binary=$RUNNER_TEMP/laneway-rust" \
              --tag "laneway-$role:ci" .
            test "$(docker run --rm --network none "laneway-$role:ci" --version)" = "$PREVIEW_VERSION"
          done
          docker buildx build --load --file deploy/containers/Dockerfile.exit-node \
            --target edge --build-arg VERSION="$PREVIEW_VERSION" \
            --build-context "node-binary=$RUNNER_TEMP/laneway-rust" --tag laneway-edge:ci .
          test "$(docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true laneway-edge:ci version)" = "$PREVIEW_VERSION"
          docker image inspect laneway-edge:ci | jq -e '.[0].Config |
            .User == "65532:65532" and .Entrypoint == ["/usr/local/bin/laneway"] and
            .Cmd == ["connector", "run"] and .Labels["io.laneway.connector-runtime"] == "rust"'
          ./integration/console-image-boundary.sh laneway-controller:ci laneway-relay:ci laneway-edge:ci
      - name: Verify fresh Edge enrollment and restart
        env:
          LANEWAY_CONNECTOR_FIXTURE_BINARIES: ${{ runner.temp }}/laneway-rust
        run: |
          ./integration/connector-bootstrap.sh laneway-edge:ci
          ./integration/connector-upgrade.sh laneway-edge:ci
          docker build --tag laneway-rust-lab:local integration/rust-lab
          bash integration/rust-lab/connector-cutover.sh --fresh laneway-edge:ci
          bash integration/rust-lab/connector-cutover.sh --fresh laneway-edge:ci tcp-fallback

  rust:
    name: Rust workspace and network integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Install Rust node interoperability network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Rust node executable interoperability
        run: >-
          sudo env PATH="$PATH" HOME="$HOME"
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          LANEWAY_RUN_PRIVILEGED=1 ./integration/rust-node-interop.sh

  rust-macos-endpoint:
    name: Rust macOS endpoint (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Cache native release probes on main
        id: macos-probes
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/laneway-macos-probes
          key: >-
            laneway-macos-probes-v1-1.91.1-${{ runner.arch }}-${{ hashFiles('rust/**', 'api/proto/**',
            'deploy/examples/*rust*.toml', 'deploy/compose/generated/config/exit-node.toml.example',
            'testvectors/local-api/**', 'integration/rust-release-macos-probes.sh') }}
      - name: Install the pinned macOS Rust compiler
        run: rustup toolchain install 1.91.1 --profile minimal && rustup default 1.91.1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: rust
          shared-key: macos-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p lanewayd-rs --lib
      - name: Build the cacheable macOS release probes
        if: github.ref == 'refs/heads/main' && steps.macos-probes.outputs.cache-hit != 'true'
        run: sh integration/rust-release-macos-probes.sh "$RUNNER_TEMP/laneway-macos-probes"
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml -p lanewayd-rs --bin lanewayd-rs
        env:
          LANEWAY_PRODUCT_VERSION: 0.0.0-ci
      - name: Install the default archive and verify real utun traffic and cleanup
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            arm64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          PACKAGE_RUST_MACOS="$GITHUB_WORKSPACE/rust/target/release/lanewayd-rs" make package VERSION=0.0.0-ci
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            export LANEWAY_MACOS_PROBES_DIR="$RUNNER_TEMP/laneway-macos-probes"
          fi
          LANEWAY_MACOS_ARCHIVE_INSTALL=1 LANEWAY_MACOS_UTUN_TEST=1 LANEWAY_MACOS_DESKTOP_TEST=1 \
            sh integration/rust-release-macos.sh \
            "dist/laneway_darwin_$arch.tar.gz" "$arch" 0.0.0-ci

  rust-linux-package:
    name: Static Rust Linux ${{ matrix.arch }} package preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 29
    env:
      PREVIEW_VERSION: *preview-version
      PREVIEW_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with: *preview-builder
      - name: Reuse unchanged preview binaries
        id: preview-cache
        uses: actions/cache/restore@v4
        with: *preview-cache-inputs
      - name: Build the native preview without publishing
        if: steps.preview-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/containers/Dockerfile.rust-release
          target: artifacts
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.PREVIEW_VERSION }}
            FLEET_ACTIVATION_FIXTURE=1
          outputs: type=local,dest=${{ runner.temp }}/laneway-rust
          cache-from: type=gha,scope=rust-release-deps-${{ matrix.arch }},timeout=1m
          # Save dependency and version-independent fixture stages from the
          # same preview build. Pull requests only restore from this cache.
          cache-to: >-
            ${{ github.ref == 'refs/heads/main' &&
            format('type=gha,scope=rust-release-deps-{0},mode=max,timeout=2m,ignore-error=true', matrix.arch) || '' }}
      - name: Verify the image uses the shared native daemon
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$PACKAGE_ARCH" --load \
            --file deploy/containers/Dockerfile.exit-node --target edge \
            --build-context "node-binary=$RUNNER_TEMP/laneway-rust" --tag laneway-edge:ci .
          version=$(docker run --rm --network none laneway-edge:ci version)
          test "$version" = "$PREVIEW_VERSION"
      - name: Build the native preview archive
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: PACKAGE_OS=linux PACKAGE_RUST_RUNTIME_DIR="$RUNNER_TEMP/laneway-rust" make package VERSION="$PREVIEW_VERSION"
      - name: Save verified preview binaries before running the network lab
        if: steps.preview-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: *preview-cache-inputs
      - name: Test installed rootless CLI and helper from the preview archive
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: sh integration/rust-release-rootless.sh --linux-archive "dist/laneway_linux_$PACKAGE_ARCH.tar.gz"
      - name: Test the native preview archive under systemd
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils iproute2 iptables nftables wireguard-tools jq iputils-ping procps
          sudo modprobe tun
          sudo modprobe wireguard
          sudo install -m 0600 /dev/null /run/.laneway-isolated-systemd-lab
          archive="dist/laneway_linux_$PACKAGE_ARCH.tar.gz"
          rustc --edition 2024 -O integration/netprobe-stream.rs -o "$RUNNER_TEMP/netprobe-stream"
          sudo env PATH="$PATH" LANEWAY_NODE_TEST_STREAM_PROBE="$RUNNER_TEMP/netprobe-stream" \
            LANEWAY_NODE_TEST_INSPECT_PROBE="$RUNNER_TEMP/laneway-rust/activation-fixture/laneway-inspect-probe" \
            LANEWAY_NODE_TEST_ENROLL_PROBE="$RUNNER_TEMP/laneway-rust/activation-fixture/prior-node" \
            bash integration/rust-release-systemd.sh "$archive" "$PACKAGE_ARCH" "$PREVIEW_VERSION"
          sudo env PATH="$PATH" bash integration/rust-release-fleet-update.sh "$archive" \
            "$RUNNER_TEMP/laneway-rust/activation-fixture"

  rust-cross-build:
    name: Rust check ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ARM64 C cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Check complete Rust workspace
        run: >-
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
          --target '${{ matrix.target }}' --locked

  privileged-linux:
    name: Privileged Linux network namespaces
    if: github.event_name == 'workflow_dispatch' && inputs.privileged_linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Run isolated privileged suite
        run: >-
          sudo env PATH="$PATH" HOME="$HOME"
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          LANEWAY_RUN_PRIVILEGED=1 ./integration/rust-kernel-netns.sh
