name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      privileged_linux:
        description: Run disposable privileged Linux network-namespace tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-node:
    uses: ./.github/workflows/node.yml

  web:
    name: Admin console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Validate management API contract and generated client
        working-directory: web
        run: corepack pnpm api:check
      - name: Reject an unscoped console build
        working-directory: web
        run: |
          if corepack pnpm build; then
            echo "unscoped console build unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Lint, typecheck, and unit tests
        working-directory: web
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Build and test the demo artifact
        working-directory: web
        run: |
          corepack pnpm build:demo
          LANEWAY_EXPECTED_BUILD_MODE=demo corepack pnpm test:e2e
      - name: Build and smoke-test the live artifact
        working-directory: web
        run: |
          corepack pnpm build:live
          LANEWAY_EXPECTED_BUILD_MODE=live corepack pnpm exec playwright test e2e/build-mode.spec.ts

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: Test
        working-directory: go
        run: |
          go build -o "$RUNNER_TEMP/laneway-controller" ./cmd/laneway-controller
          LANEWAY_CONTROLLER_BIN="$RUNNER_TEMP/laneway-controller" go test -race ./...
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l go)"

  macos-client:
    name: macOS client and privileged-helper protocol
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Run native Darwin tests
        working-directory: go
        run: |
          go test ./cmd/laneway -run '^TestMacOS'
          go test ./internal/nethelper ./internal/platform ./internal/releaseupdate

  protobuf:
    name: Protobuf lint and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: bufbuild/buf-setup-action@v1
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: buf lint
      - run: buf generate
      - run: git diff --exit-code -- go/api

  compose:
    name: Hardened Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose security, storage, health, and port model
        run: |
          shellcheck ./integration/control-plane-bootstrap.sh ./integration/control-plane-outer-installer.sh
          ./integration/compose-config.sh
          ./integration/release-contract.sh
          ./integration/native-installer.sh
          ./integration/connector-updater.sh
          ./integration/control-plane-prepare.sh
          ./integration/control-plane-bootstrap.sh
          sudo env PATH="$PATH" ./integration/control-plane-outer-installer.sh
          sudo env PATH="$PATH" ./integration/control-plane-install.sh
          sudo env PATH="$PATH" ./integration/control-plane-upgrade.sh
          ./integration/lane-workflows.sh
          ./integration/administrator-lifecycle.sh
          sudo ./integration/lane-prepare.sh
          sudo env PATH="$PATH" ./integration/lane-recovery.sh
      - name: Build pinned release image families
        run: |
          docker build --file deploy/containers/Dockerfile \
            --target controller --build-arg VERSION=ci \
            --tag laneway-controller:ci .
          docker build --file deploy/containers/Dockerfile \
            --target relay --build-arg VERSION=ci \
            --tag laneway-relay:ci .
          docker build --file deploy/containers/Dockerfile \
            --target admin --build-arg VERSION=ci \
            --tag laneway-admin:ci .
          docker build --file deploy/containers/Dockerfile.connector \
            --build-arg VERSION=ci --tag lane-edge:ci .
          docker build --file deploy/containers/Dockerfile.exit-node \
            --build-arg VERSION=ci --tag laneway-exit-node:ci .
          test "$(docker run --rm --network none laneway-controller:ci -version)" = ci
          test "$(docker run --rm --network none laneway-relay:ci -version)" = ci
          test "$(docker run --rm --network none laneway-admin:ci version)" = ci
          test "$(docker run --rm --network none lane-edge:ci version)" = ci
          test "$(docker run --rm --network none --entrypoint /usr/local/bin/laneway laneway-exit-node:ci version)" = ci
          for image in laneway-controller:ci laneway-relay:ci laneway-admin:ci lane-edge:ci laneway-exit-node:ci; do
            status=0
            output=$(docker run --rm --network none --entrypoint /usr/local/bin/laneway-healthcheck "$image" -- 2>&1) || status=$?
            test "$status" -eq 1
            grep -F 'usage: laneway-healthcheck' <<<"$output"
          done
          if docker run --rm --network none --entrypoint /bin/sh lane-edge:ci -c true; then
            echo "The connector image contains an unexpected shell" >&2
            exit 1
          fi
          ./integration/console-image-boundary.sh laneway-controller:ci laneway-relay:ci laneway-admin:ci lane-edge:ci laneway-exit-node:ci
          ./integration/connector-bootstrap.sh lane-edge:ci
          ./integration/connector-upgrade.sh lane-edge:ci

  rust:
    name: Rust workspace and Go interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Go nodes through Rust relay
        working-directory: go
        run: go test -count=1 -race -tags=rustinterop ./integration/rustrelay -v
      - name: Build side-by-side Rust CLI and Go companion
        env:
          LANEWAY_CLI_RELEASE_VERSION: 9.8.7
        run: |
          bins="$RUNNER_TEMP/cli-cutover"
          mkdir -p "$bins"
          cargo build --manifest-path rust/Cargo.toml --locked -p laneway-cli -p laneway-relay -p lanewayd -p laneway-controller
          install -m 0755 rust/target/debug/{laneway,laneway-relay} "$bins/"
          (
            cd go
            go build -tags laneway_compat -ldflags "-X laneway.dev/laneway/internal/buildinfo.Version=$LANEWAY_CLI_RELEASE_VERSION" \
              -o "$bins/laneway-compat" ./cmd/laneway
            go build -ldflags "-X laneway.dev/laneway/internal/buildinfo.Version=$LANEWAY_CLI_RELEASE_VERSION" \
              -o "$bins/laneway-go-reference" ./cmd/laneway
            go build -o "$bins/laneway-controller" ./cmd/laneway-controller
          )
      - name: Restore a Go controller backup with the Rust candidate
        run: |
          LANEWAY_CONTROLLER_RESTORE_BIN="$GITHUB_WORKSPACE/rust/target/debug/laneway-controller" \
            go -C go test ./internal/controller -count=1 -run '^TestRestoreBinaryCompatibility$'
      - name: Check controller startup and HTTPS reads with the Go client
        run: |
          candidate="$GITHUB_WORKSPACE/rust/target/debug/laneway-controller"
          LANEWAY_CONTROLLER_STARTUP_BIN="$candidate" LANEWAY_CONTROLLER_SERVE_BIN="$candidate" \
            LANEWAY_GO_CONFIG_BIN="$RUNNER_TEMP/cli-cutover/laneway-go-reference" \
            go -C go test ./cmd/laneway-controller -count=1 -run '^Test(StartupPreparation|ReadonlyServing)BinaryCompatibility$'
      - name: Check enrollment and credential renewal across controller implementations
        run: |
          bins="$RUNNER_TEMP/cli-cutover"
          python3 integration/controller-enrollment.py --go-controller "$bins/laneway-controller" \
            --candidate "$GITHUB_WORKSPACE/rust/target/debug/laneway-controller" \
            --go-cli "$bins/laneway-go-reference" --rust-cli "$bins/laneway"
      - name: Compare controller QUIC behavior and exercise native clients
        run: |
          bins="$RUNNER_TEMP/cli-cutover"
          LANEWAY_GO_CONTROLLER_BIN="$bins/laneway-controller" \
            LANEWAY_CONTROLLER_QUIC_BIN="$GITHUB_WORKSPACE/rust/target/debug/laneway-controller" \
            LANEWAY_CONTROLLER_QUIC_NODE_BIN="$GITHUB_WORKSPACE/rust/target/debug/lanewayd" \
            LANEWAY_CONTROLLER_QUIC_RELAY_BIN="$bins/laneway-relay" \
            go -C go test ./cmd/laneway-controller -count=1 -run '^TestControllerQUICCandidateCompatibility$' -v
      - name: Exercise CLI parity and companion trust
        run: |
          bins="$RUNNER_TEMP/cli-cutover"
          python3 integration/cli-rust-parity.py "$bins/laneway" "$bins/laneway-compat" "$bins/laneway-go-reference" --version 9.8.7
          sudo python3 integration/cli-rust-parity.py "$bins/laneway" "$bins/laneway-compat" "$bins/laneway-go-reference" --version 9.8.7
      - name: Exercise native login against an authenticated loopback controller and relay
        run: |
          bins="$RUNNER_TEMP/cli-cutover"
          python3 integration/login-connect.py --launcher "$bins/laneway" \
            --go-cli "$bins/laneway-go-reference" --controller "$bins/laneway-controller" \
            --relay "$bins/laneway-relay"
      - name: Install Rust node interoperability network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Exercise native saved, renewed, and ephemeral connections
        if: github.event_name == 'workflow_dispatch' && inputs.privileged_linux
        run: |
          go -C go test -c -o "$RUNNER_TEMP/cli-cutover/helper-client.test" ./internal/nethelper
          sudo unshare --net --mount --propagation private sh -eu -c '
            mount -t tmpfs -o mode=0755 tmpfs /run
            ip link set lo up
            exec python3 integration/linux-network-helper.py "$1/laneway" --exit
          ' sh "$RUNNER_TEMP/cli-cutover"
          sudo unshare --net --mount --propagation private sh -eu -c '
            mount -t tmpfs -o mode=0755 tmpfs /run
            ip link set lo up
            install -d -m 0755 /run/laneway-native
            install -m 0755 "$1/laneway" /run/laneway-native/
            LANEWAY_TEST_HELPER=/run/laneway-native/laneway LANEWAY_PRIVILEGED_TEST=1 \
              "$1/helper-client.test" -test.run="^Test(PrivilegedHelper|NativeHelperRouteRecovery)" -test.v
            python3 integration/login-connect.py --launcher "$1/laneway" \
              --go-cli "$1/laneway-go-reference" --controller "$1/laneway-controller" \
              --relay "$1/laneway-relay" --native-connect
            install -d -m 0755 /run/laneway-test
            install -m 0755 "$1"/laneway* integration/login-connect.py integration/rootless.py /run/laneway-test/
            # The mount and sudo rule exist only inside this private namespace.
            mount -t tmpfs -o mode=0750 tmpfs /etc/sudoers.d
            echo "nobody ALL=(root) NOPASSWD: /run/laneway-test/laneway-compat _network-helper --control-fd=0" \
              > /etc/sudoers.d/laneway-test
            chmod 0440 /etc/sudoers.d/laneway-test
            visudo -cf /etc/sudoers
            cd /run/laneway-test
            exec runuser -u nobody -- python3 login-connect.py --launcher ./laneway \
              --go-cli ./laneway-go-reference --controller ./laneway-controller \
              --relay ./laneway-relay --helper-connect
          ' sh "$RUNNER_TEMP/cli-cutover"
      - name: Rust node executable interoperability
        run: >-
          sudo env PATH="$PATH" HOME="$HOME"
          LANEWAY_RUST_BIN_DIR="$GITHUB_WORKSPACE/rust/target/debug"
          LANEWAY_RUN_PRIVILEGED=1 ./integration/rust-node-interop.sh

  cross-build:
    name: Go build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Compile all packages
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  rust-cross-build:
    name: Rust check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 C cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Check complete Rust workspace
        run: >-
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
          --target '${{ matrix.target }}' --locked

  privileged-linux:
    name: Privileged Linux network namespaces
    if: github.event_name == 'workflow_dispatch' && inputs.privileged_linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Run isolated privileged suite
        run: >-
          sudo env PATH="$PATH" HOME="$HOME"
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          LANEWAY_RUN_PRIVILEGED=1 ./integration/linux-netns.sh
