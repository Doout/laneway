name: Privileged Linux integration

on:
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privileged-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  network-namespaces:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: go-linux-netns
            label: Go kernel and full-stack network namespaces
            script: integration/linux-netns.sh
            runner: ubuntu-24.04
          - suite: rust-kernel-netns
            label: Rust kernel ownership and crash recovery
            script: integration/rust-kernel-netns.sh
            runner: ubuntu-24.04
          - suite: rust-node-interop
            label: Rust node and Go/Rust relay interoperability
            script: integration/rust-node-interop.sh
            runner: ubuntu-24.04
          - suite: rust-controller-node-netns
            label: Go controller authority over a Rust node
            script: integration/rust-controller-node-netns.sh
            runner: ubuntu-24.04
          - suite: docker-exit-amd64
            label: Isolated Docker Exit lifecycle (amd64)
            script: integration/docker-exit-node.sh
            runner: ubuntu-24.04
          - suite: docker-exit-arm64
            label: Isolated Docker Exit lifecycle (arm64)
            script: integration/docker-exit-node.sh
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Prepare artifact directory
        run: mkdir -p privileged-integration-logs
      - name: Install Linux networking dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping jq procps
          if [[ ! -c /dev/net/tun ]]; then
            sudo modprobe tun
          fi
          test -c /dev/net/tun
          cap_ns="lw-cap-$$"
          cleanup() {
            sudo ip netns delete "${cap_ns}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          sudo ip netns add "${cap_ns}"
          sudo ip netns exec "${cap_ns}" nft list ruleset >/dev/null
      - name: Run ${{ matrix.label }}
        env:
          INTEGRATION_SCRIPT: ${{ matrix.script }}
          INTEGRATION_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            LANEWAY_RUN_PRIVILEGED=1 \
            LANEWAY_KERNEL_BENCHMARK_OUTPUT="${PWD}/privileged-integration-logs/${INTEGRATION_SUITE}-kernel-benchmark.jsonl" \
            "./${INTEGRATION_SCRIPT}" 2>&1 | tee "privileged-integration-logs/${INTEGRATION_SUITE}.log"
      - name: Capture kernel and tool versions
        if: always()
        run: |
          mkdir -p privileged-integration-logs
          {
            uname -a
            go version
            rustc --version --verbose
            cargo --version
            ip -Version
            nft --version
          } > privileged-integration-logs/environment.txt 2>&1
      - name: Archive privileged integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privileged-linux-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: privileged-integration-logs/
          if-no-files-found: error
