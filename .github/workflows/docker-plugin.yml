name: Docker network plugin

on:
  pull_request:
    paths:
      - "go/internal/dockerplugin/**"
      - "go/cmd/laneway-docker-plugin/**"
      - "rust/laneway-docker-plugin/**"
      - "rust/Cargo.*"
      - "testvectors/docker-plugin/**"
      - "deploy/docker-plugin/**"
      - "integration/docker-plugin.sh"
      - "spec/docker-network-plugin-v1.md"
      - ".github/workflows/docker-plugin.yml"
  push:
    branches: [main]
    paths:
      - "go/internal/dockerplugin/**"
      - "go/cmd/laneway-docker-plugin/**"
      - "rust/laneway-docker-plugin/**"
      - "rust/Cargo.*"
      - "testvectors/docker-plugin/**"
      - "deploy/docker-plugin/**"
      - "integration/docker-plugin.sh"
      - "spec/docker-network-plugin-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - run: ./integration/docker-plugin.sh
      - run: go vet ./internal/dockerplugin ./cmd/laneway-docker-plugin
        working-directory: go
  rust-driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: cargo +1.91.1 test --locked --manifest-path rust/Cargo.toml -p laneway-docker-plugin
  privileged:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - run: sudo env PATH="$PATH" LANEWAY_RUN_PRIVILEGED=1 LANEWAY_DOCKER_PLUGIN_RUNTIME="$PLUGIN_RUNTIME" ./integration/docker-plugin.sh
        env:
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
