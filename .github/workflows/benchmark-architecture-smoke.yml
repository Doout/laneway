name: Architecture benchmark smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-smoke:
    name: Linux ${{ matrix.arch }} native smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: rust
          shared-key: dataplane-benchmarks-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and exercise each dataplane mode
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path rust/Cargo.toml -p laneway-bench
          for mode in node relay relay-forward; do
            rust/target/release/laneway-bench --mode "$mode" --flows 1 \
              --packet-size 1200 --duration-secs 1 --json
          done | tee benchmark-smoke.jsonl
          jq -es 'map(.mode) == ["node", "relay", "relay-forward"] and all(.[]; .packets > 0)' \
            benchmark-smoke.jsonl > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ matrix.arch }}
          path: benchmark-smoke.jsonl
          if-no-files-found: error
