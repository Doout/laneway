name: Release packages and images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COSIGN_YES: "true"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Test and vet
        working-directory: go
        run: |
          go test ./...
          go vet ./...
      - name: Test Rust relay and healthcheck
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 test --manifest-path rust/Cargo.toml --locked -p laneway-relay -p laneway-healthcheck
      - name: Check scripts
        run: shellcheck install.sh scripts/*.sh deploy/containers/*.sh deploy/compose/*.sh deploy/compose/laneway-control integration/administrator-lifecycle.sh integration/client-installer.sh integration/connector-upgrade.sh integration/connector-updater.sh integration/control-plane-bootstrap.sh integration/release-contract.sh integration/control-plane-outer-installer.sh integration/control-plane-install.sh integration/control-plane-prepare.sh integration/control-plane-upgrade.sh integration/lane-workflows.sh integration/lane-prepare.sh integration/lane-recovery.sh
      - name: Check release tag and source
        run: |
          version=${GITHUB_REF_NAME#v}
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$GITHUB_REF_TYPE" = tag
          ./integration/client-installer.sh
          ./integration/native-installer.sh
          ./integration/connector-updater.sh
          ./integration/release-contract.sh
          ./integration/control-plane-prepare.sh
          ./integration/control-plane-bootstrap.sh
          sudo env PATH="$PATH" ./integration/control-plane-outer-installer.sh
          sudo env PATH="$PATH" ./integration/control-plane-install.sh
          sudo env PATH="$PATH" ./integration/control-plane-upgrade.sh
          ./integration/lane-workflows.sh
          ./integration/administrator-lifecycle.sh
          sudo ./integration/lane-prepare.sh
          sudo env PATH="$PATH" ./integration/lane-recovery.sh

  package:
    name: ${{ matrix.os }} ${{ matrix.arch }} package
    needs: [verify, native-node]
    runs-on: ${{ matrix.os == 'linux' && matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: laneway-node-${{ matrix.os }}_${{ matrix.arch }}
          path: package-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.os == 'linux'
        with:
          name: package-relay-linux_${{ matrix.arch }}
          path: package-node
      - name: Build reproducible package
        env:
          PACKAGE_GOOS: ${{ matrix.os }}
          PACKAGE_GOARCH: ${{ matrix.arch }}
          PACKAGE_NATIVE_DIR: ${{ github.workspace }}/package-node
        run: make package VERSION="${GITHUB_REF_NAME#v}"
      - name: Verify packaged Rust executables
        if: matrix.os == 'linux'
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          extracted=$(mktemp -d)
          trap 'rm -rf -- "$extracted"' EXIT
          tar -xzf "dist/laneway_linux_${PACKAGE_ARCH}.tar.gz" -C "$extracted"
          mkdir -p "$extracted/installed/usr/local/bin" "$extracted/installed/usr/local/sbin"
          : > "$extracted/installed/usr/local/bin/laneway"
          ln -s ../bin/laneway "$extracted/installed/usr/local/sbin/lanewayd"
          DESTDIR="$extracted/installed" "$extracted/laneway/install.sh"
          installed="$extracted/installed/usr/local"
          cli="$installed/bin/laneway"
          compat="$installed/bin/laneway-compat"
          legacy="dist/laneway_linux_${PACKAGE_ARCH}"
          relay="$installed/sbin/laneway-relay"
          node="$installed/sbin/lanewayd"
          test "$("$relay" -version)" = "${GITHUB_REF_NAME#v}"
          test "$("$cli" version)" = "${GITHUB_REF_NAME#v}"
          test "$("$compat" version)" = "${GITHUB_REF_NAME#v}"
          test "$("$cli" _network-helper-native --version)" = "${GITHUB_REF_NAME#v}"
          test "$("$compat" _network-helper-bridge-version)" = "${GITHUB_REF_NAME#v}"
          "$cli" _network-helper --help
          test "$("$legacy" version)" = "${GITHUB_REF_NAME#v}"
          "$legacy" configure --help
          if "$compat" configure --help; then
            echo "Packaged compatibility helper exposes a public command" >&2
            exit 1
          fi
          test ! -L "$node"
          test "$("$node" --version)" = "lanewayd ${GITHUB_REF_NAME#v}"
          grep -Fx 'ExecStart=/usr/local/bin/laneway node run -config /etc/laneway/laneway.toml' \
            "$installed/lib/systemd/system/lanewayd.service"
          grep -Fx 'ExecStart=/usr/local/sbin/lanewayd run --system --config /etc/laneway/node-rust.toml' \
            "$installed/lib/systemd/system/lanewayd-rs.service"
          for config in relay.toml relay-controller.toml; do
            "$relay" --check-config -config "$installed/share/laneway/examples/$config"
          done
          "$cli" pki init -out-dir "$extracted"
          "$cli" pki node -ca-cert "$extracted/ca.crt" -ca-key "$extracted/ca.key" \
            -network-id 000102030405060708090a0b0c0d0e0f -node-id 101112131415161718191a1b1c1d1e1f \
            -out-cert "$extracted/node.crt" -out-key "$extracted/node.key"
          sed "s|/etc/laneway/|$extracted/|g" "$installed/share/laneway/deploy/examples/node-rust.toml" \
            > "$extracted/node.toml"
          "$node" run --system --config "$extracted/node.toml" --check-config
          for binary in "$cli" "$compat" "$legacy" "$relay" "$node"; do
            program_headers=$(readelf --wide --program-headers "$binary")
            dynamic_section=$(readelf --wide --dynamic "$binary")
            if grep -Eq '[[:space:]]INTERP[[:space:]]' <<< "$program_headers" ||
              grep -Fq '(NEEDED)' <<< "$dynamic_section"; then
              echo "Expected a standalone static executable for $PACKAGE_ARCH: $binary" >&2
              exit 1
            fi
          done
      - name: Exercise server updates and rollback through the packaged CLI
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: ./integration/control-plane-update-command.sh dist/laneway_linux_amd64.tar.gz
      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          format: spdx-json
          output-file: dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.spdx.json
          artifact-name: laneway-${{ matrix.os }}-${{ matrix.arch }}-sbom
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laneway-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            dist/laneway_${{ matrix.os }}_${{ matrix.arch }}
            dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.spdx.json
          if-no-files-found: error

  image:
    name: ${{ matrix.name }} multi-architecture image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            image: ghcr.io/doout/laneway-controller
            dockerfile: deploy/containers/Dockerfile
            target: controller
          - name: relay
            image: ghcr.io/doout/laneway-relay
            dockerfile: deploy/containers/Dockerfile
            target: relay
          - name: admin
            image: ghcr.io/doout/laneway-admin
            dockerfile: deploy/containers/Dockerfile
            target: admin
          - name: connector
            image: ghcr.io/doout/lane-edge
            dockerfile: deploy/containers/Dockerfile.connector
          - name: exit-node
            image: ghcr.io/doout/laneway-exit-node
            dockerfile: deploy/containers/Dockerfile.exit-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        name: Resolve immutable release version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build unprivileged multi-architecture scan input
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/${{ matrix.name }}.oci.tar
          provenance: false
          sbom: false
      - name: Extract OCI layout for vulnerability scanning
        run: |
          mkdir -p "/tmp/${{ matrix.name }}.oci"
          tar -xf "/tmp/${{ matrix.name }}.oci.tar" -C "/tmp/${{ matrix.name }}.oci"
          test -f "/tmp/${{ matrix.name }}.oci/index.json"
          test -f "/tmp/${{ matrix.name }}.oci/oci-layout"
      - name: Reject vulnerable image before registry publication
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          input: /tmp/${{ matrix.name }}.oci
          format: table
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.73.0
      - name: Install and verify Cosign before publication
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: type=raw,value=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: build
        name: Build and publish AMD64/ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Generate image SBOM release asset
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          artifact-name: laneway-${{ matrix.name }}-image-sbom
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Sign immutable image digest
        run: cosign sign "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image reference
        run: printf '%s@%s\n' '${{ matrix.image }}' '${{ steps.build.outputs.digest }}' > '${{ matrix.name }}.digest.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laneway-${{ matrix.name }}-image-metadata
          path: |
            ${{ matrix.name }}.digest.txt
            ${{ matrix.name }}.spdx.json
          if-no-files-found: error

  native-node:
    uses: ./.github/workflows/node.yml
    with:
      upload: true

  release:
    name: Publish signed GitHub release
    needs: [package, image, native-node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: laneway-*
          path: dist
          merge-multiple: true
      - name: Create deterministic checksums and image manifest
        working-directory: dist
        run: |
          install -m 0755 ../install.sh install.sh
          install -m 0755 ../scripts/install-node.sh install-node.sh
          install -m 0644 ../scripts/install-node.ps1 install-node.ps1
          : > bootstrap-artifacts.toml
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            os=${platform%_*}
            arch=${platform#*_}
            asset=laneway_${platform}.tar.gz
            digest=$(sha256sum -- "$asset" | awk '{print $1}')
            size=$(stat -c %s -- "$asset")
            cat >> bootstrap-artifacts.toml <<EOF
          [[bootstrap.artifacts]]
          os = "$os"
          arch = "$arch"
          url = "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset"
          sha256 = "$digest"
          size_bytes = $size
          EOF
          done
          LC_ALL=C sort -o image-digests.txt -- *.digest.txt
          rm -- *.digest.txt
          LC_ALL=C sha256sum -- bootstrap-artifacts.toml image-digests.txt install.sh install-node.sh install-node.ps1 lanewayd_* laneway-native_* laneway-compat_* laneway_*.tar.gz laneway_linux_amd64 laneway_linux_arm64 laneway_darwin_amd64 laneway_darwin_arm64 laneway_windows_*.exe *.spdx.json | sort -k2 > checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign checksum manifest
        working-directory: dist
        run: cosign sign-blob --bundle checksums.sigstore.json checksums.txt
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/bootstrap-artifacts.toml
            dist/install.sh
            dist/install-node.sh
            dist/install-node.ps1
            dist/lanewayd_*
            dist/laneway-native_*
            dist/laneway-compat_*
            dist/laneway_*.tar.gz
            dist/laneway_linux_amd64
            dist/laneway_linux_arm64
            dist/laneway_darwin_amd64
            dist/laneway_darwin_arm64
            dist/laneway_windows_*.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
