name: Release packages and images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COSIGN_YES: "true"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go/go.sum
      - name: Test and vet
        working-directory: go
        run: |
          go test ./...
          go vet ./...
      - name: Check scripts
        run: |
          python3 -m unittest discover -s deploy/compose -p 'test_*.py'
          shellcheck integration/rust-release-macos*.sh integration/rust-release-install.sh integration/rust-release-fleet-update.sh integration/rust-release-systemd.sh integration/rust-release-rootless.sh
          shellcheck install.sh scripts/*.sh deploy/containers/*.sh deploy/compose/*.sh deploy/compose/laneway-control deploy/ephemeral-exit/*.sh integration/administrator-lifecycle.sh integration/client-installer.sh integration/connector-upgrade.sh integration/connector-updater.sh integration/release-contract.sh integration/control-plane-install.sh integration/control-plane-prepare.sh integration/control-plane-upgrade.sh integration/lane-workflows.sh integration/lane-prepare.sh integration/lane-recovery.sh
          sh integration/rust-compose-release.sh
          sh integration/rust-go-runtime-guard.sh
      - name: Check release tag and source
        run: |
          version=${GITHUB_REF_NAME#v}
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$GITHUB_REF_TYPE" = tag
          ./integration/client-installer.sh
          ./integration/connector-updater.sh
          ./integration/release-contract.sh
          ./integration/control-plane-prepare.sh
          sudo env PATH="$PATH" ./integration/control-plane-install.sh
          sudo env PATH="$PATH" ./integration/control-plane-upgrade.sh
          ./integration/lane-workflows.sh
          ./integration/administrator-lifecycle.sh
          sudo ./integration/lane-prepare.sh
          sudo env PATH="$PATH" ./integration/lane-recovery.sh

  package-linux:
    name: Build Linux ${{ matrix.arch }} runtime and archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go/go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Resolve release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build static Rust runtime and fleet test fixture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/containers/Dockerfile.rust-release
          target: artifacts
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            FLEET_ACTIVATION_FIXTURE=1
            FLEET_PRIOR_VERSION=${{ github.ref_name == 'v0.0.0' && '0.0.1' || '0.0.0' }}
          outputs: type=local,dest=${{ runner.temp }}/runtime
          cache-from: type=gha,scope=rust-release-deps-${{ matrix.arch }},timeout=1m
      - name: Archive binaries with executable permissions
        working-directory: ${{ runner.temp }}/runtime
        run: |
          tar -czf "$RUNNER_TEMP/runtime.tar.gz" -- ./*-rs
          tar -czf "$RUNNER_TEMP/activation-fixture.tar.gz" -- activation-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-fixture-${{ matrix.arch }}
          path: ${{ runner.temp }}/activation-fixture.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Build reproducible package
        env:
          PACKAGE_GOOS: ${{ matrix.os }}
          PACKAGE_GOARCH: ${{ matrix.arch }}
          PACKAGE_RUST_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: make package VERSION="${GITHUB_REF_NAME#v}"
      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: &package-sbom
          file: dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          format: spdx-json
          output-file: dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.spdx.json
          artifact-name: laneway-${{ matrix.os }}-${{ matrix.arch }}-sbom
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: &upload-package
          name: laneway-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            dist/laneway_${{ matrix.os }}_${{ matrix.arch }}
            dist/laneway_${{ matrix.os }}_${{ matrix.arch }}.spdx.json
          if-no-files-found: error

  check-linux:
    name: Linux ${{ matrix.arch }} archive / ${{ matrix.check }}
    needs: package-linux
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        check: [systemd, fleet-update]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: laneway-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-fixture-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Test installed rootless CLI and helper from the release archive
        if: matrix.check == 'systemd'
        env:
          PACKAGE_GOARCH: ${{ matrix.arch }}
        run: sh integration/rust-release-rootless.sh --linux-archive "dist/laneway_linux_$PACKAGE_GOARCH.tar.gz"
      - name: Prepare the isolated systemd runner
        run: |
          packages=(binutils iproute2 iptables nftables wireguard-tools jq iputils-ping procps)
          sudo apt-get install -y --no-install-recommends "${packages[@]}" || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          }
          sudo modprobe tun
          sudo modprobe wireguard
          sudo install -m 0600 /dev/null /run/.laneway-isolated-systemd-lab
      - name: Test the exact release archive under systemd
        env:
          PACKAGE_GOARCH: ${{ matrix.arch }}
          CHECK: ${{ matrix.check }}
        run: |
          archive="dist/laneway_linux_$PACKAGE_GOARCH.tar.gz"
          tar -xzf "$RUNNER_TEMP/activation-fixture.tar.gz" -C "$RUNNER_TEMP"
          case "$CHECK" in
            systemd)
              fixtures="$RUNNER_TEMP/laneway-go-fixtures"
              mkdir "$fixtures"
              CGO_ENABLED=0 go -C go build -o "$fixtures/" ./cmd/laneway ./cmd/laneway-relay ./integration/rustnodecontroller
              rustc --edition 2024 -O integration/netprobe-stream.rs -o "$fixtures/netprobe-stream"
              sudo env PATH="$PATH" LANEWAY_NODE_TEST_GO_FIXTURE_DIR="$fixtures" \
                LANEWAY_NODE_TEST_STREAM_PROBE="$fixtures/netprobe-stream" \
                LANEWAY_NODE_TEST_INSPECT_PROBE="$RUNNER_TEMP/activation-fixture/laneway-inspect-probe" \
                LANEWAY_NODE_TEST_ENROLL_PROBE="$RUNNER_TEMP/activation-fixture/prior-node" \
                bash integration/rust-release-systemd.sh "$archive" \
                "$PACKAGE_GOARCH" "${GITHUB_REF_NAME#v}" ;;
            fleet-update)
              sudo env PATH="$PATH" bash integration/rust-release-fleet-update.sh "$archive" \
                "$RUNNER_TEMP/activation-fixture" ;;
            *) exit 1 ;;
          esac

  package-macos:
    name: ${{ matrix.os }} ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go/go.sum
      - name: Restore native release probes from main
        id: macos-probes
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/laneway-macos-probes
          key: >-
            laneway-macos-probes-v1-1.91.1-${{ runner.arch }}-${{ hashFiles('rust/**', 'api/proto/**',
            'deploy/examples/*rust*.toml', 'deploy/compose/generated/config/exit-node.toml.example',
            'testvectors/local-api/**', 'integration/rust-release-macos-probes.sh') }}
      - name: Install the pinned macOS Rust compiler
        run: rustup toolchain install 1.91.1 --profile minimal && rustup default 1.91.1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: rust
          shared-key: macos-release
          save-if: 'false'
      - name: Build the native macOS Rust runtime candidate
        run: |
          LANEWAY_PRODUCT_VERSION="${GITHUB_REF_NAME#v}" cargo +1.91.1 build --locked --release \
            --manifest-path rust/Cargo.toml -p lanewayd-rs --bin lanewayd-rs
          printf 'PACKAGE_RUST_MACOS=%s\n' "$GITHUB_WORKSPACE/rust/target/release/lanewayd-rs" >> "$GITHUB_ENV"
      - name: Build reproducible package
        env:
          PACKAGE_GOOS: ${{ matrix.os }}
          PACKAGE_GOARCH: ${{ matrix.arch }}
        run: make package VERSION="${GITHUB_REF_NAME#v}"
      - name: Test the macOS release archive on its native architecture
        env:
          PACKAGE_GOARCH: ${{ matrix.arch }}
          LANEWAY_MACOS_PROBES_DIR: ${{ steps.macos-probes.outputs.cache-hit == 'true' && format('{0}/laneway-macos-probes', runner.temp) || '' }}
        run: |
          RUSTUP_TOOLCHAIN=1.91.1 LANEWAY_MACOS_ARCHIVE_INSTALL=1 LANEWAY_MACOS_UTUN_TEST=1 LANEWAY_MACOS_DESKTOP_TEST=1 \
            sh integration/rust-release-macos.sh \
            "dist/laneway_darwin_$PACKAGE_GOARCH.tar.gz" "$PACKAGE_GOARCH" "${GITHUB_REF_NAME#v}"
      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: *package-sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: *upload-package

  image:
    name: ${{ matrix.role.name }} linux/${{ matrix.arch }} image
    needs: [verify, package-linux]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        role: &release-images
          - name: edge
            image: ghcr.io/doout/laneway/edge
            dockerfile: deploy/containers/Dockerfile.exit-node
            target: edge
          - name: console
            image: ghcr.io/doout/laneway/console
            dockerfile: deploy/containers/Dockerfile.rust-relay
            target: controller
          - name: relay
            image: ghcr.io/doout/laneway/relay
            dockerfile: deploy/containers/Dockerfile.rust-relay
            target: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        name: Resolve immutable release version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - id: runtime
        name: Supply prebuilt Rust binaries to the image
        run: |
          mkdir "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C "$RUNNER_TEMP/runtime"
          {
            echo 'contexts<<EOF'
            for binary in node controller relay healthcheck; do
              printf '%s-binary=%s/runtime\n' "$binary" "$RUNNER_TEMP"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build unprivileged native scan input
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.role.dockerfile }}
          target: ${{ matrix.role.target }}
          build-contexts: ${{ steps.runtime.outputs.contexts }}
          build-args: &image-build-args |
            VERSION=${{ steps.version.outputs.value }}
            SOURCE_DATE_EPOCH=0
          labels: &image-labels |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=/tmp/release.oci.tar
          provenance: false
          sbom: false
      - name: Extract OCI layout for vulnerability scanning
        run: |
          mkdir /tmp/release.oci
          tar -xf /tmp/release.oci.tar -C /tmp/release.oci
          test -f /tmp/release.oci/index.json
          test -f /tmp/release.oci/oci-layout
      - name: Reject vulnerable image before registry publication
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          input: /tmp/release.oci
          format: table
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.73.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Push the native candidate by digest only
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.role.dockerfile }}
          target: ${{ matrix.role.target }}
          build-contexts: ${{ steps.runtime.outputs.contexts }}
          build-args: *image-build-args
          labels: *image-labels
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ matrix.role.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
      - name: Verify the registry candidate matches the scan
        env:
          IMAGE: ${{ matrix.role.image }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          scanned=$(jq -er --arg arch "$ARCH" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
            | if length == 1 then .[0].digest else error("expected one scanned platform") end
          ' /tmp/release.oci/index.json)
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -e --arg arch "$ARCH" --arg scanned "$scanned" '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch and .digest == $scanned)
            and any(.manifests[]; .annotations["vnd.docker.reference.type"] == "attestation-manifest"
              and .annotations["vnd.docker.reference.digest"] == $scanned)
          ' >/dev/null
          printf '%s\n' "$DIGEST" > "$ARCH.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-platform-${{ matrix.role.name }}-${{ matrix.arch }}
          path: ${{ matrix.arch }}.digest
          if-no-files-found: error

  image-index:
    name: Publish and sign ${{ matrix.name }} index
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: *release-images
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-platform-${{ matrix.name }}-*
          path: platform-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
      - name: Install Cosign before publication
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Assemble and verify both native platforms
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          amd64=$(<platform-digests/amd64.digest)
          arm64=$(<platform-digests/arm64.digest)
          [[ $amd64 =~ ^sha256:[0-9a-f]{64}$ && $arm64 =~ ^sha256:[0-9a-f]{64}$ && $amd64 != "$arm64" ]]
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create --metadata-file index.json \
            --annotation "index:org.opencontainers.image.version=$version" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$version" "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(jq -er '."containerimage.descriptor".digest' index.json)
          docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -e '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"]
            and ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              | .annotations["vnd.docker.reference.digest"]] | sort)
              == ([.manifests[] | select(.platform.os == "linux") | .digest] | sort)
          ' >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate image SBOM release asset
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          artifact-name: laneway-${{ matrix.name }}-image-sbom
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Sign immutable image digest
        run: cosign sign "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image reference
        run: printf '%s@%s\n' '${{ matrix.image }}' '${{ steps.build.outputs.digest }}' > '${{ matrix.name }}.digest.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laneway-${{ matrix.name }}-image-metadata
          path: |
            ${{ matrix.name }}.digest.txt
            ${{ matrix.name }}.spdx.json
          if-no-files-found: error

  release:
    name: Publish signed GitHub release
    needs: [check-linux, package-macos, image-index]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: laneway-*
          path: dist
          merge-multiple: true
      - name: Create deterministic checksums and image manifest
        working-directory: dist
        run: |
          install -m 0755 ../install.sh install.sh
          install -m 0755 ../deploy/ephemeral-exit/bootstrap.sh ephemeral-exit-bootstrap.sh
          : > bootstrap-artifacts.toml
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            os=${platform%_*}
            arch=${platform#*_}
            asset=laneway_${platform}.tar.gz
            digest=$(sha256sum -- "$asset" | awk '{print $1}')
            size=$(stat -c %s -- "$asset")
            cat >> bootstrap-artifacts.toml <<EOF
          [[bootstrap.artifacts]]
          os = "$os"
          arch = "$arch"
          url = "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset"
          sha256 = "$digest"
          size_bytes = $size
          EOF
          done
          LC_ALL=C sort -o image-digests.txt -- *.digest.txt
          rm -- *.digest.txt
          LC_ALL=C sha256sum -- bootstrap-artifacts.toml ephemeral-exit-bootstrap.sh image-digests.txt install.sh laneway_*.tar.gz laneway_darwin_amd64 laneway_darwin_arm64 *.spdx.json | sort -k2 > checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign checksum manifest
        working-directory: dist
        run: cosign sign-blob --bundle checksums.sigstore.json checksums.txt
      - name: Verify with the installer trust policy before publishing
        run: |
          set -euo pipefail
          source deploy/ephemeral-exit/bootstrap.sh
          verify_exit_release_signature "$(command -v cosign)" dist "$GITHUB_REF_NAME"
          (cd dist && sha256sum --strict -c checksums.txt)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the complete Rust release image set before publishing
        run: sh deploy/compose/verify-rust-release.sh --publish "$GITHUB_REF_NAME" dist >/dev/null
      - name: Install and recover the signed Rust candidate before publishing
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends age jq || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends age jq
          }
          sudo modprobe tun
          if ! getent ahostsv4 laneway-release.localhost >/dev/null; then
            printf '%s\n' '127.0.0.1 laneway-release.localhost' | sudo tee -a /etc/hosts >/dev/null
          fi
          sudo install -m 0600 /dev/null /run/.laneway-isolated-signed-release-lab
          sudo env PATH="$PATH" DOCKER_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}" \
            bash integration/rust-release-install.sh dist "$GITHUB_REF_NAME"
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/bootstrap-artifacts.toml
            dist/ephemeral-exit-bootstrap.sh
            dist/install.sh
            dist/laneway_*.tar.gz
            dist/laneway_darwin_amd64
            dist/laneway_darwin_arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_commit=$(git rev-parse --verify "$tag_ref^{commit}")
          test "$tag_commit" = "$GITHUB_SHA"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          # Checkout can point the local tag ref at the peeled commit. Read the
          # authoritative tag object so pinned releases never publish as Latest.
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | [.type, .sha] | @tsv')
          IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
          flags=()
          case "$tag_type" in
            tag)
              annotation=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
              jq -e --arg tag "$GITHUB_REF_NAME" --arg commit "$tag_commit" \
                '.tag == $tag and .object.type == "commit" and .object.sha == $commit' <<< "$annotation" >/dev/null
              tag_subject=$(jq -r '.message | split("\n")[0]' <<< "$annotation")
              if [[ $tag_subject == 'Laneway pinned prerelease' ]]; then
                flags+=(--prerelease --latest=false)
              fi
              ;;
            commit) test "$tag_sha" = "$tag_commit" ;;
            *) exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
