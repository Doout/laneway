[package]
name = "lanewayd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Laneway node with userspace proxy and Linux system networking"

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
base64.workspace = true
clap = { version = "4.5", features = ["derive"] }
laneway-private = { path = "../laneway-private" }
getrandom.workspace = true
hex.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
lanewayd-rs = { path = "../lanewayd", default-features = false }
prost.workspace = true
rpassword = "7"
rcgen = "0.14.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webpki = { package = "rustls-webpki", version = "0.103.13" }
x25519-dalek = "2.0.1"
x509-parser.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lanewayd-rs = { path = "../lanewayd", default-features = false, features = ["native"] }

[dev-dependencies]
tempfile = "3.26"
