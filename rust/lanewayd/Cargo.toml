[package]
name = "lanewayd-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Linux Laneway node dataplane"

[[bin]]
name = "lanewayd-rs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
bytes.workspace = true
crossbeam-queue.workspace = true
getrandom.workspace = true
hex.workspace = true
humantime-serde.workspace = true
ipnet.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
prost.workspace = true
quinn.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
rustls.workspace = true
webpki = { package = "rustls-webpki", version = "0.103.13" }
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tun.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wait-timeout.workspace = true
x509-parser.workspace = true

[dev-dependencies]
laneway-relay = { path = "../laneway-relay" }
rcgen = "0.14.5"
tempfile = "3.26.0"
