[workspace]
members = ["laneway-bench", "laneway-protocol", "laneway-relay", "lanewayd"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
base64 = "0.22.1"
bytes = "1.11.1"
crossbeam-queue = "0.3.12"
getrandom = "0.4.3"
hex = "0.4.3"
humantime-serde = "1.1.1"
ipnet = { version = "2.12.1", features = ["serde"] }
prost = "0.14.4"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tun = "0.15.2"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wait-timeout = "0.2.1"
x509-parser = "0.18.1"
