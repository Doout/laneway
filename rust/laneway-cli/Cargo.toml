[package]
name = "laneway-cli"
version = "0.1.0"
default-run = "laneway"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface for Laneway nodes and deployments"

[[bin]]
name = "laneway"
path = "src/main.rs"

[[bin]]
name = "laneway-compat-windows"
path = "src/windows_compat.rs"
required-features = ["windows-compat"]

[features]
windows-compat = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
ipnet.workspace = true
laneway-private = { path = "../laneway-private" }
laneway-protocol = { path = "../laneway-protocol" }
lanewayd-rs = { path = "../lanewayd", default-features = false }
mime = "0.3"
prost.workspace = true
rcgen = { version = "0.14.5", features = ["x509-parser"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "http2", "rustls-tls-native-roots"] }
rpassword = "7"
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.26"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["process"] }
webpki = { package = "rustls-webpki", version = "0.103.13" }
x25519-dalek = "2.0.1"
x509-parser = { workspace = true, features = ["verify"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tracing-subscriber.workspace = true
laneway-config = { path = "../laneway-config" }
ring = "0.17"
fs2 = "0.4"
rustix = { version = "1.1.4", features = ["fs", "net"] }
toml.workspace = true
lanewayd-rs = { path = "../lanewayd", default-features = false, features = ["native"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "net"] }
lanewayd-rs = { path = "../lanewayd", default-features = false, features = ["native"] }
