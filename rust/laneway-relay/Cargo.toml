[package]
name = "laneway-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authenticated QUIC DATAGRAM and TLS/TCP fallback relay for Laneway"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-trait = "0.1"
bytes.workspace = true
crossbeam-queue.workspace = true
futures-util = { version = "0.3", default-features = false }
getrandom.workspace = true
humantime-serde.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
pem = "3"
prost.workspace = true
quinn.workspace = true
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem", "zeroize"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider"] }
rustls.workspace = true
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "webpki-roots"] }
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.26.0"
tokio.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true
zeroize = "1"
