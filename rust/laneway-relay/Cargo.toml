[package]
name = "laneway-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authenticated QUIC DATAGRAM and TLS/TCP fallback relay for Laneway"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-trait = "0.1.89"
bytes.workspace = true
crossbeam-queue.workspace = true
futures-util = "0.3.32"
getrandom.workspace = true
http-body-util = "0.1"
humantime-serde.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
percent-encoding = "2"
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "pem"] }
pem = "3.0.6"
prost.workspace = true
quinn.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider"] }
rustls.workspace = true
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "webpki-roots"] }
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = "0.6.5"
tempfile = "3.26.0"
tokio.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true

[dev-dependencies]
rcgen = "0.14.5"
