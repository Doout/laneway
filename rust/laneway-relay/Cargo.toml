[package]
name = "laneway-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authenticated QUIC DATAGRAM and TLS/TCP fallback relay for Laneway"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
bytes.workspace = true
crossbeam-queue.workspace = true
getrandom.workspace = true
humantime-serde.workspace = true
ipnet.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
prost.workspace = true
quinn.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-no-provider"] }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true

[dev-dependencies]
rcgen = "0.14.5"
tempfile = "3.26.0"
