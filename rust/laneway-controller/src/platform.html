<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenants · Laneway Platform</title>
  <style><!-- platform styles --></style>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <!-- platform brand -->
      <form method="post" action="/platform/sign-out">
        <button type="submit">Sign out</button>
      </form>
    </div>
  </header>
  <main class="workspace">
    <h1 id="tenants-heading">Tenants</h1>
    <div class="workspace-grid">
      <div class="directory">
        <table aria-labelledby="tenants-heading">
          <thead>
            <tr><th scope="col">Hostname</th><th scope="col">Status</th></tr>
          </thead>
          <tbody><!-- tenants --></tbody>
          <tbody class="empty-directory">
            <tr><td colspan="2">No tenants yet.</td></tr>
          </tbody>
        </table>
      </div>
      <section class="tenant-intake" aria-labelledby="intake-heading">
        <h2 id="intake-heading">Add tenant</h2>
        <form class="form-stack" method="post" action="/tenants">
          <label>
            Subdomain
            <input name="slug" required maxlength="63" pattern="[a-z0-9](?:[a-z0-9\-]*[a-z0-9])?" autocapitalize="none" spellcheck="false" aria-describedby="intake-hint">
          </label>
          <p id="intake-hint" class="hint">An operator reviews and stages the tenant before it goes live.</p>
          <button class="primary-button" type="submit">Reserve name</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
