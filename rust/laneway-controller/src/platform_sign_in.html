<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Laneway Platform</title>
  <style><!-- platform styles --></style>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <!-- platform brand -->
    </div>
  </header>
  <main class="sign-in">
    <h1>Sign in</h1>
    <form class="form-stack" method="post" action="/platform/sign-in">
      <label>
        Username
        <input name="username" autocomplete="username" autocapitalize="none" required maxlength="64">
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required maxlength="128">
      </label>
      <!-- error -->
      <button class="primary-button" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
