[package]
name = "laneway-controller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Laneway controller storage and runtime"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
argon2 = { version = "0.5.3", default-features = false, features = ["alloc","zeroize"] }
base64.workspace = true
bytes.workspace = true
form_urlencoded = "1"
getrandom.workspace = true
hex.workspace = true
http-body-util = "0.1"
httpdate = "1"
ipnet.workspace = true
maxminddb = "0.33"
mime = "0.3"
prost.workspace = true
quinn.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls.workspace = true
rcgen = { version = "0.14.8", default-features = false, features = ["ring","x509-parser","zeroize"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring","std"] }
time = "0.3"
x509-parser.workspace = true
yasna = "0.6"
rustls-pemfile.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
sha2.workspace = true
subtle = "2"
zeroize = "1"
thiserror.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
x25519-dalek = "2"
tempfile = "3.26.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
