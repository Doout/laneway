[package]
name = "laneway-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
rusqlite = { version = "0.37", features = ["backup", "bundled", "hooks"] }
sha2.workspace = true
tempfile = "3.27"
laneway-config = { path = "../laneway-config" }

[target.'cfg(target_os = "linux")'.dependencies]
ipnet.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
laneway-protocol = { path = "../laneway-protocol" }
x509-parser = { workspace = true, features = ["verify"] }
base64.workspace = true
prost.workspace = true
quinn.workspace = true
rcgen = { version = "0.14.5", features = ["x509-parser"] }
time = "0.3"
x25519-dalek = "2.0.1"
getrandom.workspace = true
rustix = { version = "1.1", features = ["fs"] }
bytes.workspace = true
form_urlencoded = "1.2"
hex.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime = "0.3"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
subtle = "2.6"
tokio.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
zeroize = "1"
