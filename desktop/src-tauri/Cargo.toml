[package]
name = "laneway-desktop"
version = "0.1.0"
description = "Laneway endpoint desktop client"
authors = ["Laneway contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[lib]
name = "laneway_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "laneway-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
libc = "0.2.175"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3.21.0"
